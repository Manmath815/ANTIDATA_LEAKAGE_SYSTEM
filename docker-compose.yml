version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: data_leakage_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: data_leakage_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: data_leakage_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/data_leakage_db
      SECRET_KEY: "09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7"
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: data_leakage_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
